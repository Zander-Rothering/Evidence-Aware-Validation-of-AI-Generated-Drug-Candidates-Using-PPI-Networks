name: project_env

channels:
  - conda-forge
  - pytorch

dependencies:
  - python=3.10
  - numpy
  - pandas
  - matplotlib
  - scikit-learn=1.7.2
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - networkx
  - rdkit
  - biopython
  - goatools
  - requests
  - rich
  - pip

  - pip:
    - transformers==4.41.0
    - huggingface-hub==0.23.4
    - torch-geometric
    - node2vec
    - stringdb
    - chembl_webresource_client